const map = L.map('map').setView([37.55, 126.99], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  { attribution: '&copy; OpenStreetMap', maxZoom: 19 }).addTo(map);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eok = mw => (mw / 10000).toFixed(2).replace(/0$/, '') + '억';
const ym = s => s ? `${String(s).slice(2, 4)}.${String(s).slice(4, 6)}` : '-';
const m = v => v == null ? '<span class="far">-</span>' : v + 'm';
const n = v => v == null ? '<span class="far">-</span>' : v;

const layer = L.layerGroup().addTo(map);
const markers = DATA.map((c, i) => {
  const mixed = (c.complex_type || '').includes('주상복합');
  const mk = L.circleMarker([c.lat, c.lon], {
    radius: 7, color: mixed ? '#b91c1c' : '#1d4ed8',
    fillColor: mixed ? '#ef4444' : '#3b82f6', fillOpacity: .8, weight: 1 });
  mk.bindPopup(`<b>${esc(c.apt)}</b> <span class="band">${esc(c.area_band)}</span><br>
    ${esc(c.sido || '')} ${esc(c.gu)} ${esc(c.dong)} · ${esc(c.complex_type || '분류미상')} ${n(c.households)}세대

    대표가 ${eok(c.price_manwon)} · 점수 ${c.score}<br>
    ${esc(c.station)} ${c.station_dist_m}m${c.commute_min != null ?
      ' → ' + esc(c.commute_to) + ' 약 ' + Math.round(c.commute_min) + '분' : ''}<br>
    ${esc(c.school || '-')} ${c.school_dist_m ?? '-'}m<br>
    중 ${c.middle_school_count ?? 0}곳 · 고 ${c.high_school_count ?? 0}곳 · 학원 ${c.academy_count ?? 0}<br>
    병원 ${c.hospital_count ?? 0} · 마트 ${c.mart_nearest_m ?? '-'}m · 시장 ${c.market_nearest_m ?? '-'}m<br>
    <small>${esc(c.price_basis)} · 최근거래 ${ym(c.latest_deal_ym)} ${eok(c.latest_price_manwon)}
    ${c.approved_on ? '· 사용승인 ' + esc(c.approved_on) : ''}</small>`);
  mk.on('click', () => highlight(i));
  return mk;
});

const uniq = k => [...new Set(DATA.map(c => c[k]).filter(Boolean))].sort();
uniq('sido').forEach(v => sidoFilter.insertAdjacentHTML('beforeend', `<option>${esc(v)}</option>`));
uniq('gu').forEach(v => guFilter.insertAdjacentHTML('beforeend', `<option>${esc(v)}</option>`));
uniq('area_band').forEach(v => bandFilter.insertAdjacentHTML('beforeend', `<option>${esc(v)}</option>`));

let sortKey = 'score', sortAsc = false, visible = [];

function links(c) {
  const q = encodeURIComponent(`${c.gu} ${c.apt}`);
  return `<span class="links">
    <a href="https://m.land.naver.com/search/result/${q}" target="_blank" rel="noopener">네이버</a>
    <a href="https://hogangnono.com/search?q=${q}" target="_blank" rel="noopener">호갱</a>
    <a href="https://map.kakao.com/?q=${q}" target="_blank" rel="noopener">지도</a></span>`;
}

function render() {
  const gu = guFilter.value, band = bandFilter.value, sido = sidoFilter.value;
  const minS = +minScore.value || 0, minH = +minHh.value || 0;
  const maxC = +maxCommute.value || 0;
  visible = DATA.map((c, i) => ({ c, i }))
    .filter(({ c }) => (!sido || c.sido === sido) && (!gu || c.gu === gu)
      && (!band || c.area_band === band)
      && c.score >= minS && (c.households ?? 0) >= minH
      && (!maxC || (c.commute_min != null && c.commute_min <= maxC)))
    .sort((a, b) => {
      const x = a.c[sortKey] ?? -Infinity, y = b.c[sortKey] ?? -Infinity;
      const r = x < y ? -1 : x > y ? 1 : 0;
      return sortAsc ? r : -r;
    });

  document.querySelector('#tbl tbody').innerHTML = visible.map(({ c, i }) => {
    const mixed = (c.complex_type || '').includes('주상복합');
    return `<tr data-i="${i}">
      <td class="score">${c.score}</td>
      <td>${esc(c.apt)}${mixed ? ' <span class="type mixed">주상복합</span>' : ''}</td>
      <td>${esc(c.sido || '')} ${esc(c.gu)} ${esc(c.dong)}</td>
      <td><span class="band">${esc(c.area_band)}</span></td>
      <td class="price">${eok(c.price_manwon)}</td>
      <td>${c.commute_min == null ? '<span class="far">-</span>'
            : Math.round(c.commute_min) + '분<span class="sub"> ' + esc(c.commute_to) + '</span>'}</td>
      <td>${n(c.households)}${c.dong_count ? `<span class="sub"> /${c.dong_count}동</span>` : ''}</td>
      <td>${esc(c.build_year)}</td>
      <td>${esc(c.station)}<span class="sub"> ${c.station_dist_m}m</span></td>
      <td>${esc((c.school || '-').replace(/^서울/, ''))}<span class="sub"> ${c.school_dist_m ?? '-'}m</span></td>
      <td>중${c.middle_school_count ?? 0}·고${c.high_school_count ?? 0}<span class="sub"> 학원${c.academy_count ?? 0}</span></td>
      <td>${c.hospital_count ?? 0}<span class="sub"> ${c.hospital_nearest_m ?? '-'}m</span></td>
      <td>${m(c.mart_nearest_m)}</td>
      <td>${m(c.market_nearest_m)}</td>
      <td>${links(c)}</td>
    </tr>`;
  }).join('');
  count.textContent = `${visible.length}곳 / 전체 ${DATA.length}곳`;
  document.getElementById('empty').hidden = visible.length > 0;

  layer.clearLayers();
  visible.forEach(({ i }) => layer.addLayer(markers[i]));
  document.querySelectorAll('#tbl th').forEach(th => {
    th.classList.toggle('sorted', th.dataset.k === sortKey);
    th.classList.toggle('asc', th.dataset.k === sortKey && sortAsc);
  });
}

function highlight(i) {
  document.querySelectorAll('#tbl tbody tr').forEach(tr =>
    tr.classList.toggle('active', +tr.dataset.i === i));
  const row = document.querySelector(`#tbl tbody tr[data-i="${i}"]`);
  if (row) row.scrollIntoView({ block: 'nearest' });
}

document.querySelector('#tbl tbody').addEventListener('click', e => {
  const tr = e.target.closest('tr');
  if (!tr || e.target.closest('a')) return;
  const mk = markers[tr.dataset.i];
  map.setView(mk.getLatLng(), 16); mk.openPopup(); highlight(+tr.dataset.i);
});
document.querySelectorAll('#tbl th[data-k]').forEach(th => th.onclick = () => {
  if (sortKey === th.dataset.k) sortAsc = !sortAsc;
  else { sortKey = th.dataset.k; sortAsc = false; }
  render();
});
sidoFilter.onchange = guFilter.onchange = bandFilter.onchange = render;
minScore.oninput = minHh.oninput = maxCommute.oninput = render;
render();
if (DATA.length) map.fitBounds(L.latLngBounds(DATA.map(c => [c.lat, c.lon])).pad(0.1));
</script>
