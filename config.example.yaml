# ============================================================
# 실거주 아파트 찾기 - 설정 예시
#   cp config.example.yaml config.yaml   # 그 뒤 키를 채워 넣으세요
#
# config.yaml은 .gitignore에 있어 커밋되지 않습니다.
# 키를 파일에 두기 싫으면 환경변수로 대체할 수 있습니다:
#   export APT_DATA_GO_KR=...      export APT_SEOUL_OPEN_DATA=...
#   export APT_NEIS=...            export APT_KAKAO_REST=...
# 환경변수가 있으면 config.yaml 값보다 우선합니다.
# ============================================================

api_keys:
  # 공공데이터포털(data.go.kr) 일반 인증키(Decoding).
  # 실거래가 API와 공동주택 단지정보 API 모두 이 키 하나로 사용 (각각 활용신청 필요)
  data_go_kr: "여기에_키_입력"

  # 서울 열린데이터광장(data.seoul.go.kr) 인증키 - 지하철역 좌표 조회용
  seoul_open_data: "여기에_키_입력"

  # 나이스 교육정보 개방포털(open.neis.go.kr) 인증키 - 학교 위치 조회용
  neis: "여기에_키_입력"

  # 카카오 개발자(developers.kakao.com) REST API 키 - 주소→좌표 지오코딩용
  kakao_rest: "여기에_키_입력"

# 외부 API 한도. 카카오 로컬 API는 일 30,000건이 기본 한도다.
# 예산을 넘어서면 캐시를 저장하고 중단한다 (다음 날 이어서 실행하면 캐시부터 재개).
api_limits:
  kakao_daily_call_budget: 25000
  # 자차 길찾기(카카오모빌리티)는 별도 한도(일 5,000건)를 쓴다.
  # 좌표 단위로 캐시하므로 같은 단지의 여러 면적대는 1회만 호출된다.
  kakao_driving_call_budget: 4500

criteria:
  # 가격 범위 (만원 단위). "면적대별 대표가격" 기준으로 적용된다.
  price_min: 30000
  price_max: 70000

  # 실거래가 수집 기간 (최근 N개월)
  lookback_months: 12

  # 대표가격 산정에 쓸 최근 창(개월). 이 기간 거래가 있으면 그 중앙값을,
  # 없으면 lookback_months 전체 중앙값을 쓴다. (시세 변동 반영)
  price_window_months: 6

  # 대표가격을 신뢰하려면 최소 몇 건의 거래가 필요한가 (1건짜리 특이거래 배제)
  min_trade_count: 2

  # 전용면적 하한/상한 (㎡). 실거주 기준 59㎡ 이상 = 방3 최소선
  area_min_m2: 59
  area_max_m2: 0        # 0 = 상한 없음

  # 서울 도심까지 지하철 추정 소요시간 상한 (분). 0 = 제한 없음
  # 서울 단지도 같은 기준으로 평가된다.
  max_commute_min: 45

  # 역세권 기준: 단지 → 가장 가까운 지하철역 직선거리 (미터)
  # 자차 이동도 함께 보므로 도보 10분 선(800m)까지 열어둔다.
  station_max_distance_m: 800

  # 학교 기준: 단지 → 가장 가까운 초등학교 직선거리 (미터)
  # 필터가 아니라 점수/표시에 사용. 필터로 쓰려면 school_filter: true
  school_max_distance_m: 800
  school_filter: false

  # 세대수 하한 (0 = 제한 없음). 300세대 미만은 관리비·환금성이 불리하다.
  min_households: 300

  # 제외할 단지분류. 부분 일치로 걸러진다("도시형 생활주택(주상복합)"도 포함).
  exclude_complex_types: ["주상복합"]

  # 공공 단지정보에 매칭되지 않은 단지를 버릴지 여부.
  # true면 세대수·주상복합 여부를 확인한 단지만 남는다.
  require_complex_match: true

  # 단지분류를 끝내 확인하지 못한 단지도 버릴지 여부.
  # true면 "주상복합이 아님이 확인된" 단지만 남는다.
  require_type_known: true

# 면적대 구간. 같은 단지라도 구간이 다르면 별도 후보로 집계한다.
# (34㎡와 84㎡가 한 중앙값에 섞이는 것을 막기 위함)
# min 이상 max 미만 (㎡). max: 0 = 상한 없음
area_bands:
  - { label: "소형(~55㎡)",  min: 0,   max: 55 }
  - { label: "59㎡형",       min: 55,  max: 66 }
  - { label: "74㎡형",       min: 66,  max: 80 }
  - { label: "84㎡형",       min: 80,  max: 96 }
  - { label: "100㎡형",      min: 96,  max: 115 }
  - { label: "115㎡+",       min: 115, max: 0 }

# GitHub Pages 등으로 공개할 사본 경로 (비우면 만들지 않는다).
# 여기에 쓰인 파일은 저장소에 커밋되므로, 공개하고 싶지 않으면 ""로 두세요.
publish_to: "docs/index.html"

# 가격 이력 기간 (개월). 84 = 7년.
# 원본을 다 들고 있지 않고 "단지 × 면적대 × 반기 중앙값"으로 접어서 저장한다.
# 늘리면 수집 시간과 API 호출이 비례해 늘어난다 (시군구 × 개월 수).
history_months: 84

# 한국부동산원 단지 식별정보 CSV 경로 (비우면 프로젝트 폴더에서 자동 탐색)
reb_csv: ""

# 단지 주변 편의시설 조사 (카카오 로컬 반경검색)
#   kind: category(카테고리코드) 또는 keyword(검색어)
#   contains: 카테고리명에 이 문자열이 든 결과만 집계 (검색어 오탐 제거용)
amenities:
  hospital:         { kind: category, code: HP8, radius_m: 1000 }
  general_hospital: { kind: keyword,  query: "종합병원", radius_m: 3000, contains: "종합병원" }
  mart:             { kind: category, code: MT1, radius_m: 1500 }
  market:           { kind: keyword,  query: "전통시장", radius_m: 1500, contains: "시장" }
  academy:          { kind: category, code: AC5, radius_m: 1000 }

# 학군 지표: 중·고 접근성 + 학원가 밀집도로 근사한다.
# (학업성취도는 공개가 중단되어 공식 API가 없다)
school_zone:
  middle_radius_m: 1000      # 이 반경 안의 중학교 수를 센다
  high_radius_m: 1500        # 이 반경 안의 고등학교 수를 센다
  schools_for_full_score: 3  # 이 개수 이상이면 접근성 만점
  academy_saturation: 80     # 이 개수 이상이면 학원가 밀집 만점

# 조회 대상: 경기도 시군구 (서울 도심까지 추정 60분 이내인 곳만 기본 포함)
# 주석의 분 수는 그 시군구에서 가장 빠른 역 기준 추정치다. 실제 필터는
# 단지별 최근접역 기준으로 criteria.max_commute_min에서 걸린다.
# 더 넓게 보려면 아래에 시군구코드를 추가하면 된다 (예: "41220": "평택시").
gyeonggi_districts:
  "41290": "과천시"            # 강남 22분
  "41135": "성남시 분당구"       # 강남 23분
  "41192": "부천시 원미구"       # 시청 23분
  "41194": "부천시 소사구"       # 시청 25분
  "41210": "광명시"            # 여의도 27분
  "41131": "성남시 수정구"       # 강남 30분
  "41310": "구리시"            # 시청 31분
  "41465": "용인시 수지구"       # 강남 33분
  "41360": "남양주시"           # 시청 33분
  "41281": "고양시 덕양구"       # 시청 34분
  "41133": "성남시 중원구"       # 강남 34분
  "41390": "시흥시"            # 여의도 35분
  "41173": "안양시 동안구"       # 강남 36분
  "41196": "부천시 오정구"       # 시청 36분
  "41150": "의정부시"           # 시청 37분
  "41610": "광주시"            # 강남 39분
  "41463": "용인시 기흥구"       # 강남 39분
  "41570": "김포시"            # 여의도 43분
  "41287": "고양시 일산서구"      # 시청 43분
  "41285": "고양시 일산동구"      # 시청 44분
  "41117": "수원시 영통구"       # 강남 45분
  "41410": "군포시"            # 강남 46분
  "41597": "화성시 동탄구"       # 강남 47분
  "41171": "안양시 만안구"       # 여의도 47분
  "41450": "하남시"            # 시청 47분
  "41630": "양주시"            # 시청 48분
  "41273": "안산시 단원구"       # 여의도 54분
  "41430": "의왕시"            # 강남 58분
  "41480": "파주시"            # 시청 59분

# 나이스 시도교육청 코드. B10 서울 · J10 경기 · E10 인천
school_office_codes: ["B10", "J10"]

# 서울 접근성: 최근접역에서 아래 거점역까지 지하철 추정 소요시간
# (급행·특급과 배차간격은 반영되지 않아 보수적으로 나온다. 순위 비교용)
access:
  destinations: ["강남", "시청", "여의도"]

  # 자차 소요시간도 조회해 "지하철·자차 중 빠른 쪽"으로 접근성을 판정한다.
  # 실시간 조회는 실행 시각마다 값이 달라지므로 항상 다음 평일 아침 기준으로 본다.
  driving: true
  driving_departure_hour: 8

# 지하철 소요시간 추정 상수 (참고 구간 16곳으로 보정, 평균오차 약 6분)
transit:
  default_speed_kmh: 37
  dwell_min: 0.3          # 정차 시간
  transfer_min: 3.5       # 환승 1회
  initial_wait_min: 1.5   # 승강장 대기
  route_factor: 1.15      # 직선거리 → 선로 실거리 보정
  line_speed_kmh:
    "GTX-A": 100
    "신분당선": 48
    "공항철도": 55
    "경의선": 45
    "경춘선": 48
    "수인분당선": 42
    "경강선": 50
    "서해선": 45
    "01호선": 52
    "인천선": 33
    "인천2호선": 33

# 점수 가중치 (합계 100 권장)
scoring:
  commute: 18            # 서울 도심 접근성 (빠를수록 높음)
  station_distance: 12   # 역이 가까울수록 높음
  school_zone: 12        # 학군 (중·고 접근성 + 학원가 밀집도)
  school_distance: 10    # 초등학교가 가까울수록 높음
  households: 10         # 세대수가 많을수록 높음
  trade_activity: 10     # 거래 활발도 (환금성 대용지표)
  build_year: 8          # 준공년도가 최근일수록 높음
  hospital: 8            # 병원 접근성
  mart: 7                # 대형마트 접근성
  market: 5              # 전통시장 접근성

# 점수 그룹 — 총점을 성격별로 쪼개 본다.
# scoring의 모든 항목이 정확히 한 그룹에만 들어가야 한다 (그래야 그룹 합 = 총점).
score_groups:
  transit: { label: "교통",       items: [commute, station_distance] }
  school:  { label: "학군",       items: [school_distance, school_zone] }
  complex: { label: "단지",       items: [households, build_year, trade_activity] }
  life:    { label: "생활인프라", items: [hospital, mart, market] }

# 세대수 점수 만점 기준
households_for_full_score: 1500

# 조회 대상: 서울 25개 자치구 법정동 시군구코드 (행정표준코드)
# 특정 구만 보려면 필요 없는 줄을 삭제하세요.
